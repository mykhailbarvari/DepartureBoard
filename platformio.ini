; PlatformIO Project Configuration File
;
; Dokumentation: https://docs.platformio.org/page/projectconf.html

[platformio]
description = A departure board based on the ESP32 Devkit

[env:esp32-s3-devkitm-1]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitm-1
framework = arduino

; Brädan är en ESP32-S3R8 (16 MB flash, 8 MB PSRAM) trots att board-definitionen
; ovan antar 8 MB. Utan detta är halva flashen oåtkomlig.
; NVS ligger på 0x9000 i både default_8MB och default_16MB → sparade
; inställningar överlever partitionsbytet.
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

; PSRAM är avsiktligt INTE aktiverat. Octal-PSRAM kan konkurrera om
; minnesbandbredd med HUB75-DMA:n. Aktivera först när något faktiskt
; behöver det, och mät uppdateringsfrekvensen efteråt:
; board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

; Biblioteken i lib/ inkluderar varandras headers i flera led;
; standardlaget hittar inte hela kedjan.
lib_ldf_mode = deep+

build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=2
    ; Avkommentera för att logga hur lång tid en bildruta tar. Avgör hur lågt
    ; UI_FRAME_MS (lib/ui/src/ui_anim.h) kan sättas för mjukare animationer.
    ; -DUI_FRAME_PROFILE

; Pinnade versioner = projektet bygger på vilken maskin som helst.
; Ersätter det tidigare lib_extra_dirs mot ~/Documents/Arduino/libraries.
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.13
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit BusIO@1.17.4
    ricmoo/QRCode@0.0.1
